name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Bridge (Rust)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C linker=rust-lld"
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory `
            | Where-Object { $_.Name -match '^10\.\d+\.\d+\.\d+$' } `
            | Sort-Object Name -Descending | Select-Object -First 1
          $env:LIB = "$($sdk.FullName)\um\x64;$($sdk.FullName)\ucrt\x64"
          Write-Host "Windows SDK: $($sdk.Name)"
          cargo build --release
        working-directory: agent-hooks-bridge

      - name: Publish App (C#)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          dotnet publish AgentScope.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/AgentScope | Out-Null
          Copy-Item AgentScope.App/bin/Release/net8.0-windows/win-x64/publish/* publish/AgentScope/ -Recurse -Force
          Copy-Item agent-hooks-bridge/target/release/agent-hooks-bridge.exe publish/AgentScope/ -Force
          Copy-Item AgentScope.App/Assets publish/AgentScope/Assets -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item AgentScope.App/Locales publish/AgentScope/Locales -Recurse -Force -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "C:\Program Files*\Inno Setup 6" -Filter "ISCC.exe" `
            -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "ISCC.exe not found — Inno Setup installation may have failed"
            exit 1
          }
          & $iscc.FullName installer/agent-scope-setup.iss

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AgentScope-Setup-v*.exe
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
